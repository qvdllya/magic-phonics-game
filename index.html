<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Potion Blending Game</title>
    <style>
        /* WITCH / MAGIC THEME STYLING */
        body {
            background-color: #1a0b2e; /* Dark purple */
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #39ff14; text-shadow: 0 0 10px #39ff14; }
        .container {
            background-color: #2d1254;
            border: 5px solid #8a2be2;
            border-radius: 20px;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            box-shadow: 0 0 20px #8a2be2;
        }
        .word-display {
            font-size: 60px;
            letter-spacing: 10px;
            margin: 20px 0;
            color: #ffd700; /* Gold */
        }
        .audio-btn {
            background-color: #39ff14;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 5px #228b22;
        }
        .audio-btn:active { box-shadow: 0 2px #228b22; transform: translateY(3px); }
        
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .option-btn {
            background-color: #fff;
            border: 4px solid #8a2be2;
            border-radius: 15px;
            padding: 20px;
            font-size: 60px; /* Big emojis */
            cursor: pointer;
            transition: transform 0.2s;
        }
        .option-btn:hover { transform: scale(1.1); border-color: #ffd700; }
        
        /* DASHBOARD */
        #dashboard { display: none; }
        .score { font-size: 40px; color: #39ff14; }
        .feedback { font-size: 24px; margin-top: 20px; color: #ffd700; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>🧙‍♀️ Magic Potion Lab 🧪</h1>
        <p>Listen to the sounds and pick the correct picture!</p>
        <button class="audio-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <h1>Blend the Potion!</h1>
        <div id="word-display" class="word-display">c a t</div>
        
        <!-- Audio Button -->
        <button class="audio-btn" onclick="playSound()">🔊 Listen to Sounds</button>
        
        <p>Which picture matches the sounds?</p>
        <div class="options" id="options-container">
            <!-- Options will be generated by JS -->
        </div>
    </div>

    <!-- DASHBOARD / END SCREEN -->
    <div id="dashboard">
        <h1>📊 Teacher Dashboard</h1>
        <p>Pupil has completed the game!</p>
        <div class="score" id="final-score">0 / 5</div>
        <p class="feedback" id="feedback-text"></p>
        <button class="audio-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
    // GAME DATA (Target CVC words from your assignment)
    const words = [
        { word: "c a t", emoji: "🐱", sound: "cat" },
        { word: "s u n", emoji: "☀️", sound: "sun" },
        { word: "b e d", emoji: "🛏️", sound: "bed" },
        { word: "p i g", emoji: "🐷", sound: "pig" },
        { word: "h a t", emoji: "🎩", sound: "hat" }
    ];

    let currentQuestion = 0;
    let score = 0;
    let currentWordObj = null;

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestion >= words.length) {
            showDashboard();
            return;
        }

        currentWordObj = words[currentQuestion];
        document.getElementById('word-display').innerText = currentWordObj.word;
        
        // Generate Options (1 correct, 2 random incorrect)
        let options = [currentWordObj.emoji];
        let availableEmojis = words.filter(w => w.emoji !== currentWordObj.emoji).map(w => w.emoji);
        
        // Pick 2 random wrong options
        while(options.length < 3) {
            let randomEmoji = availableEmojis[Math.floor(Math.random() * availableEmojis.length)];
            if(!options.includes(randomEmoji)) options.push(randomEmoji);
        }

        // Shuffle options
        options.sort(() => Math.random() - 0.5);

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        options.forEach(emoji => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = emoji;
            btn.onclick = () => checkAnswer(emoji);
            container.appendChild(btn);
        });

        // Auto-play sound after a short delay
        setTimeout(playSound, 500);
    }

    function playSound() {
        // Web Speech API to read the word
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(currentWordObj.sound);
            utterance.rate = 0.7; // Slower for blending
            window.speechSynthesis.speak(utterance);
        }
    }

    function checkAnswer(selectedEmoji) {
        if (selectedEmoji === currentWordObj.emoji) {
            score++;
            alert("✨ Correct! You made the potion!");
        } else {
            alert("❌ Oops! Try again next time.");
        }
        currentQuestion++;
        loadQuestion();
    }

    function showDashboard() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('dashboard').style.display = 'block';
        
        let finalScoreElement = document.getElementById('final-score');
        finalScoreElement.innerText = score + " / " + words.length;

        let feedback = document.getElementById('feedback-text');
        if (score === 5) {
            feedback.innerText = "Excellent! Independent blending mastered! (Green)";
            feedback.style.color = "#39ff14";
        } else if (score >= 3) {
            feedback.innerText = "Good job! Needs a little more practice. (Yellow)";
            feedback.style.color = "#ffd700";
        } else {
            feedback.innerText = "Needs remedial support with blending. (Red)";
            feedback.style.color = "#ff3333";
        }
    }
</script>

</body>
</html>
